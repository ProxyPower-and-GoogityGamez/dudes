<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Control Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
        }
        .header {
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: #38bdf8; margin: 0; font-size: 24px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .card h3 { margin: 10px 0 0 0; font-size: 18px; color: #f1f5f9; }
        .card p { font-size: 12px; color: #94a3b8; margin: 5px 0 0 0; }
        
        /* Game View Wrapper */
        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100000;
            font-size: 12px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Available Flight Simulation Frameworks</h1>
    </div>

    <!-- The Grid layout where you pick your games -->
    <div class="grid">
        <!-- Game 1: Bit Planes -->
        <div class="card" onclick="playGame('https://medv.io')">
            <div style="font-size: 40px;">✈️</div>
            <h3>Bit Planes</h3>
            <p>Flight Physics & Controls</p>
        </div>

        <!-- Placeholder 2 -->
        <div class="card" onclick="alert('Add more game links in the code later!')">
            <div style="font-size: 40px;">🧱</div>
            <h3>Framework Beta</h3>
            <p>Unassigned Slot</p>
        </div>

        <!-- Placeholder 3 -->
        <div class="card" onclick="alert('Add more game links in the code later!')">
            <div style="font-size: 40px;">🕹️</div>
            <h3>Framework Gamma</h3>
            <p>Unassigned Slot</p>
        </div>
    </div>

    <!-- Hidden full-screen window that loads the clicked game -->
    <div id="game-container">
        <button class="back-btn" onclick="closeGame()">⬅ Back to Menu</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-container').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>

</body>
</html>
